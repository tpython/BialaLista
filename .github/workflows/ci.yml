name: CI - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WhiteListApi.slnx

      - name: Build solution (Release)
        run: dotnet build WhiteListApi.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test WhiteListApi.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
